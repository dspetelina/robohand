<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#069ee9">
  <title>РобоРука</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-512.png?v=7">
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:linear-gradient(145deg,#03c8f4,#087ee9);color:white;font-family:system-ui,sans-serif;text-align:center}.card{width:min(88vw,420px);padding:28px 22px;border-radius:28px;background:#ffffff22;box-shadow:0 15px 50px #004a8666;backdrop-filter:blur(10px)}img{width:150px;height:150px;border-radius:30px;box-shadow:0 8px 30px #00345f55}h1{font-size:34px;margin:15px 0 5px}.status{font-size:17px;opacity:.92;margin:0 0 18px}.loader{width:54px;height:54px;margin:10px auto;border:6px solid #ffffff55;border-top-color:white;border-radius:50%;animation:spin .8s linear infinite}button{display:none;width:100%;padding:15px;border:0;border-radius:14px;background:white;color:#075fa8;font:700 18px system-ui}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <img src="./icon-512.png?v=7" alt="РобоРука">
    <h1>РобоРука</h1>
    <p class="status" id="status">Запускаю программу…</p>
    <div class="loader" id="loader"></div>
    <button id="retry">Открыть программу</button>
  </main>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(console.error);
    const openPlayer = () => location.replace('./player.html');
    document.getElementById('retry').addEventListener('click', openPlayer);
    setTimeout(openPlayer, 250);
    setTimeout(() => {
      document.getElementById('status').textContent = 'Если программа не открылась, нажмите кнопку';
      document.getElementById('loader').style.display = 'none';
      document.getElementById('retry').style.display = 'block';
    }, 8000);
  </script>
</body>
</html>
